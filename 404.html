<script>
(() => {
  'use strict';
  const languageButtons = [...document.querySelectorAll('[data-lang]')];
  const translatedText = [...document.querySelectorAll('[data-de]')].map(el => ({element: el, english: el.textContent, german: el.dataset.de}));
  const translatedLabels = [...document.querySelectorAll('[data-de-label]')].map(el => ({element: el, english: el.getAttribute('aria-label') || '', german: el.dataset.deLabel}));
  const languageKey = 'superintelnex-language';
  let language = 'en';
  function setLanguage(nextLanguage) {
    language = nextLanguage === 'de' ? 'de' : 'en';
    document.documentElement.lang = language;
    const translation = language === 'de' ? 'german' : 'english';
    for (const item of translatedText) item.element.textContent = item[translation];
    for (const item of translatedLabels) item.element.setAttribute('aria-label', item[translation]);
    for (const button of languageButtons) button.setAttribute('aria-pressed', String(button.dataset.lang === language));
  }
  for (const button of languageButtons) {
    button.addEventListener('click', () => {
      setLanguage(button.dataset.lang);
      try { localStorage.setItem(languageKey, language); } catch {}
    });
  }
  try { setLanguage(localStorage.getItem(languageKey)); } catch { setLanguage('en'); }
})();
</script>
