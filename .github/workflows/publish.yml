# Synchronisiert den statischen Publish-Tree und veröffentlicht ihn über GitHub Pages.
name: Publish main -> gh-pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'index.html'
      - '404.html'
      - 'impressum.html'
      - 'datenschutz.html'
      - 'kontakt.html'
      - 'whitepaper.html'
      - 'vendor/three.min.js'
      - 'token/assets/superintelnex-logo-512.png'
      - 'og-image.png'
      - 'apple-touch-icon.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'manifest.webmanifest'
      - 'superintelnex-sn-anthrazit.svg'
      - 'superintelnex-sn-tab.svg'
      - 'CNAME'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: gh-pages auf Main-Stand bringen
        id: publish-tree
        run: |
          set -euo pipefail
          # Temp-Ordner AUSSERHALB des Worktrees: ein .publish/ im Worktree
          # blockiert "git checkout gh-pages" (untracked vs. tracked-Konflikt)
          # und wandert per "git add -A" in den Publish-Tree.
          TMP="$(mktemp -d)"
          SOURCE_SHA="$(git rev-parse --short=7 HEAD)"
          for f in index.html 404.html impressum.html datenschutz.html \
                   kontakt.html whitepaper.html vendor/three.min.js \
                   token/assets/superintelnex-logo-512.png \
                   og-image.png apple-touch-icon.png icon-192.png icon-512.png \
                   robots.txt sitemap.xml manifest.webmanifest \
                   superintelnex-sn-anthrazit.svg superintelnex-sn-tab.svg CNAME; do
            mkdir -p "$TMP/$(dirname "$f")"
            [ -f "$f" ] && cp "$f" "$TMP/$f" || { echo "FEHLT auf main: $f"; exit 1; }
          done
          git config user.name  "SuperIntelNex CI"
          git config user.email "superintelnex@gmail.com"
          # gh-pages vom Remote holen — der lokale Stand (via main-Checkout) ist
          # sonst hinter dem Remote und der Push wird non-fast-forward abgelehnt.
          git fetch -q origin gh-pages
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git checkout -q -B gh-pages origin/gh-pages
          else
            git checkout -q -b gh-pages
          fi
          git rm -rq --ignore-unmatch .
          cp -R "$TMP/." .
          git add -A
          if git diff --staged --quiet; then
            echo "gh-pages bereits auf Main-Stand — nichts zu tun."
          else
            git commit -q -m "publish: sync mit main @ $SOURCE_SHA (CI)"
            git push -q origin gh-pages
            echo "gh-pages synchronisiert."
          fi
          echo "path=$TMP" >> "$GITHUB_OUTPUT"

      - name: GitHub-Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.publish-tree.outputs.path }}

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
